<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #e94560;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
            letter-spacing: 3px;
        }

        .subtitle {
            color: #a8b2d8;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 24px;
            color: white;
            min-width: 100px;
        }

        .score-box .label {
            font-size: 0.75rem;
            color: #a8b2d8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-box .score {
            font-size: 2rem;
            font-weight: 700;
        }

        .score-box.player .score { color: #e94560; }
        .score-box.computer .score { color: #0f9b8e; }
        .score-box.draws .score { color: #f5a623; }

        .status {
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            min-height: 35px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 8px 20px;
            display: inline-block;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 320px;
            margin: 0 auto 30px auto;
        }

        .cell {
            width: 96px;
            height: 96px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .cell:hover:not(.taken) {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(233, 69, 96, 0.5);
            transform: scale(1.05);
        }

        .cell.x {
            color: #e94560;
            text-shadow: 0 0 15px rgba(233, 69, 96, 0.7);
        }

        .cell.o {
            color: #0f9b8e;
            text-shadow: 0 0 15px rgba(15, 155, 142, 0.7);
        }

        .cell.winner {
            background: rgba(255, 255, 255, 0.15);
            border-color: #f5a623;
            box-shadow: 0 0 20px rgba(245, 166, 35, 0.4);
            animation: pulse 0.6s ease infinite alternate;
        }

        .cell.taken {
            cursor: default;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        .btn {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(233, 69, 96, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .difficulty {
            margin-bottom: 20px;
        }

        .difficulty label {
            color: #a8b2d8;
            font-size: 0.85rem;
            margin-right: 10px;
        }

        .difficulty select {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .difficulty select option {
            background: #1a1a2e;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TIC TAC TOE</h1>
        <p class="subtitle">You are <strong style="color:#e94560;">X</strong> &nbsp;|&nbsp; Computer is <strong style="color:#0f9b8e;">O</strong></p>

        <div class="scoreboard">
            <div class="score-box player">
                <div class="label">You (X)</div>
                <div class="score" id="playerScore">0</div>
            </div>
            <div class="score-box draws">
                <div class="label">Draws</div>
                <div class="score" id="drawScore">0</div>
            </div>
            <div class="score-box computer">
                <div class="label">CPU (O)</div>
                <div class="score" id="computerScore">0</div>
            </div>
        </div>

        <div class="difficulty">
            <label>Difficulty:</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <div class="status" id="status">Your turn! Click a square.</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button class="btn" onclick="resetGame()">New Game</button>
    </div>

    <script>
        let board = Array(9).fill(null);
        let gameOver = false;
        let playerScore = 0;
        let computerScore = 0;
        let drawScore = 0;

        const winningCombos = [
            [0,1,2],[3,4,5],[6,7,8], // rows
            [0,3,6],[1,4,7],[2,5,8], // columns
            [0,4,8],[2,4,6]          // diagonals
        ];

        const cells = document.querySelectorAll('.cell');
        cells.forEach(cell => cell.addEventListener('click', handlePlayerClick));

        function handlePlayerClick(e) {
            const index = e.target.dataset.index;
            if (board[index] || gameOver) return;

            makeMove(index, 'X');

            if (!gameOver) {
                document.getElementById('status').textContent = "Computer is thinking...";
                setTimeout(computerMove, 400);
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            const cell = document.querySelector(`[data-index="${index}"]`);
            cell.textContent = player;
            cell.classList.add(player.toLowerCase(), 'taken');

            const winner = checkWinner();
            if (winner) {
                highlightWinner(winner.combo);
                if (winner.player === 'X') {
                    playerScore++;
                    document.getElementById('playerScore').textContent = playerScore;
                    document.getElementById('status').textContent = "🎉 You win!";
                } else {
                    computerScore++;
                    document.getElementById('computerScore').textContent = computerScore;
                    document.getElementById('status').textContent = "💻 Computer wins!";
                }
                gameOver = true;
            } else if (board.every(cell => cell)) {
                drawScore++;
                document.getElementById('drawScore').textContent = drawScore;
                document.getElementById('status').textContent = "🤝 It's a draw!";
                gameOver = true;
            } else if (player === 'X') {
                document.getElementById('status').textContent = "Your turn! Click a square.";
            }
        }

        function computerMove() {
            if (gameOver) return;
            const difficulty = document.getElementById('difficulty').value;
            let index;

            if (difficulty === 'easy') {
                index = randomMove();
            } else if (difficulty === 'medium') {
                index = Math.random() < 0.5 ? bestMove() : randomMove();
            } else {
                index = bestMove();
            }

            makeMove(index, 'O');
            if (!gameOver) {
                document.getElementById('status').textContent = "Your turn! Click a square.";
            }
        }

        function randomMove() {
            const empty = board.map((v,i) => v === null ? i : null).filter(v => v !== null);
            return empty[Math.floor(Math.random() * empty.length)];
        }

        function bestMove() {
            // Check if computer can win
            for (let i = 0; i < 9; i++) {
                if (!board[i]) {
                    board[i] = 'O';
                    if (checkWinner()) { board[i] = null; return i; }
                    board[i] = null;
                }
            }
            // Block player from winning
            for (let i = 0; i < 9; i++) {
                if (!board[i]) {
                    board[i] = 'X';
                    if (checkWinner()) { board[i] = null; return i; }
                    board[i] = null;
                }
            }
            // Take center
            if (!board[4]) return 4;
            // Take a corner
            const corners = [0,2,6,8].filter(i => !board[i]);
            if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
            // Take any side
            return randomMove();
        }

        function checkWinner() {
            for (const combo of winningCombos) {
                const [a, b, c] = combo;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return { player: board[a], combo };
                }
            }
            return null;
        }

        function highlightWinner(combo) {
            combo.forEach(i => {
                document.querySelector(`[data-index="${i}"]`).classList.add('winner');
            });
        }

        function resetGame() {
            board = Array(9).fill(null);
            gameOver = false;
            cells.forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
                cell.addEventListener('click', handlePlayerClick);
            });
            document.getElementById('status').textContent = "Your turn! Click a square.";
        }
    </script>
</body>
</html>
